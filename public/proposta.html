<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0d0b09" />
    <title>Proposta de móveis planejados</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/proposta.css" />
    <script type="module" src="/js/proposta.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-whats" viewBox="0 0 24 24"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4l-4.4 1.5 1.5-4.2a8.5 8.5 0 1 1 15.5-4.7z" /><path d="M9 9.5c.3 2.3 2.4 4.6 5 5.2" /></symbol>
      <symbol id="i-regua" viewBox="0 0 24 24"><path d="M3.5 16 16 3.5 20.5 8 8 20.5z" /><path d="m7.4 12.1 1.8 1.8M10.3 9.2l1.3 1.3M13.1 6.4l1.8 1.8" /></symbol>
      <symbol id="i-projeto" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2" /><path d="M8 8h8M8 12h8M8 16h5" /></symbol>
      <symbol id="i-dobradica" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="16" rx="1.5" /><rect x="13" y="4" width="7" height="16" rx="1.5" /><path d="M11 8h2M11 16h2" /></symbol>
      <symbol id="i-montagem" viewBox="0 0 24 24"><path d="m14.5 6.5 3-3 3 3-3 3M17.5 3.5 9 12" /><path d="M4 20l5-5 2 2-5 5z" /></symbol>
      <symbol id="i-escudo" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z" /><path d="m9 12 2.2 2.2L15.5 10" /></symbol>
      <symbol id="i-limpeza" viewBox="0 0 24 24"><path d="M14 3.5 11 11M7 11h8l1.5 9.5h-11z" /><path d="M9.5 15v3M12.5 15v3" /></symbol>
      <symbol id="i-caminhao" viewBox="0 0 24 24"><path d="M3 6.5h11v9.5H3zM14 10h4l3 3.2V16h-7" /><circle cx="7" cy="17.5" r="1.8" /><circle cx="17" cy="17.5" r="1.8" /></symbol>
      <symbol id="i-chave" viewBox="0 0 24 24"><path d="M15.5 4a4.5 4.5 0 0 0-4.3 5.9L4.5 16.6a1.4 1.4 0 0 0 0 2l.9.9a1.4 1.4 0 0 0 2 0l6.7-6.7A4.5 4.5 0 0 0 20 8.5l-2.8 1.4-2.1-2.1L16.5 5A4.5 4.5 0 0 0 15.5 4z" /></symbol>
      <symbol id="i-ambiente" viewBox="0 0 24 24"><path d="M3.5 20.5V10.2L12 3.5l8.5 6.7v10.3" /><path d="M9 20.5v-6h6v6" /></symbol>
      <symbol id="i-baixar" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14" /></symbol>
      <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 4 3 19.5h18z" /><path d="M12 10v4.5M12 17v.2" /></symbol>
      <symbol id="i-esq" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
      <symbol id="i-dir" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" /></symbol>
    </svg>

    <main id="proposta" class="estado" aria-busy="true">
      <span class="girando" aria-hidden="true"></span>
      <span>Abrindo a proposta…</span>
    </main>
    <div id="medidor" aria-hidden="true"></div>
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
    <noscript>Ative o JavaScript para ver a proposta.</noscript>
  </body>
</html>
